<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>API 代理 · 管理面板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #4285F4;
            --primary-light: #EDF2FF;
            --primary-soft: #DBE7FF;
            --bg: #FAFBFF;
            --card: #FFFFFF;
            --text: #1C233D;
            --text-2: #5E6985;
            --text-3: #959DB8;
            --border: #E7EBFA;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 6px 20px rgba(40, 50, 70, 0.05);
            --shadow-hover: 0 10px 28px rgba(40, 50, 70, 0.1);
            --green: #4caf50;
            --yellow: #ff9800;
            --red: #f44336;
            --transition: all 0.28s ease;
        }
        html.dark {
            --bg: #12141D;
            --card: #1C233D;
            --text: #F0F2FF;
            --text-2: #C5CEE7;
            --text-3: #8A94B3;
            --border: #2B3249;
        }
        body {
            background: var(--bg);
            font-family: 'SF Pro Display', 'Inter', system-ui, -apple-system, sans-serif;
            padding: 24px;
            color: var(--text);
            min-height: 100vh;
            transition: var(--transition);
            line-height: 1.55;
        }
        .container {
            max-width: 1380px;
            margin: 0 auto;
        }
        .page-head {
            margin-bottom: 24px;
        }
        .page-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .page-desc {
            color: var(--text-2);
            font-size: 14px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
            margin-bottom: 20px;
        }
        .card:hover {
            box-shadow: var(--shadow-hover);
        }
        .api-wrap {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
            margin-bottom: 16px;
        }
        .api-item {
            padding: 14px;
            background: var(--primary-light);
            border-radius: var(--radius-sm);
        }
        .api-path {
            font-weight: 600;
            color: var(--primary);
            font-size: 14px;
            margin-bottom: 4px;
        }
        .api-desc {
            font-size: 12px;
            color: var(--text-2);
        }
        .base-url-info {
            font-size: 13px;
            color: var(--text-3);
            padding-top: 12px;
            border-top: 1px dashed var(--border);
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .btn {
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(66,133,244,0.2);
        }
        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            box-shadow: none;
        }
        .btn-outline:hover {
            background: var(--primary-light);
        }
        .btn-danger { background: var(--red); }
        .btn-sm { padding: 5px 12px; font-size: 13px; }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .table-box { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        th {
            color: var(--text-2);
            font-weight: 600;
            background: rgba(0,0,0,0.02);
        }
        tr:hover { background: rgba(66,133,244,0.03); }
        .text-ellipsis {
            max-width: 220px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            position: relative;
            cursor: default;
        }
        .text-ellipsis:hover::after {
            content: attr(data-full);
            position: absolute;
            bottom: 100%;
            left: 0;
            background: #252a37;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            white-space: pre-wrap;
            z-index: 99;
            width: max-content;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .status-dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .logs-box {
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 16px;
            max-height: 280px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.6;
        }
        .pagination {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .modal, .model-select-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(3px);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-content {
            background: var(--card);
            width: 92%;
            max-width: 520px;
            border-radius: var(--radius);
            padding: 24px;
            border: 1px solid var(--border);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal input, .modal select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 14px;
        }
        .modal input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .loading {
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--card);
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-hover);
            border: 1px solid var(--border);
            display: none;
            z-index: 999;
            font-size: 14px;
        }
        .model-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 8px 0;
            min-height: 40px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px;
            background: var(--bg);
        }
        .model-tag {
            background: var(--primary-light);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .model-tag .remove-tag {
            cursor: pointer;
            color: var(--red);
            font-weight: bold;
            margin-left: 4px;
        }
        .add-model-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .add-model-row input {
            flex: 1;
        }
        .log-auto-refresh {
            margin-left: 10px;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .model-checkbox-list {
            max-height: 300px;
            overflow-y: auto;
            margin: 10px 0;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px;
        }
        .model-checkbox-list label {
            display: block;
            margin: 4px 0;
        }
        @media (max-width: 768px) {
            body { padding: 16px; }
            .api-wrap { grid-template-columns: 1fr; }
            th, td { padding: 10px 6px; font-size: 13px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="page-head">
        <h1 class="page-title">API 代理管理面板</h1>
        <p class="page-desc">v3.5 · 运行时间: <span id="uptime">--</span></p>
    </div>

    <div class="card">
        <h2 class="section-title">接入接口</h2>
        <div class="api-wrap">
            <div class="api-item"><div class="api-path">/v1/chat/completions</div><div class="api-desc">聊天补全 OpenAI 兼容</div></div>
            <div class="api-item"><div class="api-path">/v1/models</div><div class="api-desc">获取模型列表</div></div>
            <div class="api-item"><div class="api-path">/health</div><div class="api-desc">服务健康状态检测</div></div>
            <div class="api-item"><div class="api-path">/admin</div><div class="api-desc">后台管理面板</div></div>
        </div>
        <div class="base-url-info">基础访问地址：<span id="baseURL"></span></div>
    </div>

    <div class="status-grid" id="statusCards"></div>

    <div class="card">
        <h2 class="section-title">密钥采集源</h2>
        <div class="btn-group"><button class="btn" onclick="openSourceModal()">+ 添加采集源</button></div>
        <div class="table-box">
            <table><thead><tr><th>名称</th><th>采集地址</th><th>目标模型</th><th>API 端点</th><th>操作</th></tr></thead><tbody id="sourcesTable"></tbody></table>
        </div>
    </div>

    <div class="card">
        <h2 class="section-title">供应商列表</h2>
        <div class="btn-group">
            <button class="btn" onclick="openAddModal()">+ 添加供应商</button>
            <button class="btn btn-outline" onclick="refreshAll()">刷新数据</button>
        </div>
        <div class="table-box">
            <table><thead><tr><th>名称</th><th>优先级</th><th>响应延迟</th><th>运行状态</th><th>操作</th></tr></thead><tbody id="providerTable"></tbody></table>
        </div>
    </div>

    <div class="card">
        <h2 class="section-title">最近运行日志</h2>
        <div class="btn-group">
            <button class="btn btn-sm" onclick="loadLogs(currentLogPage)">刷新日志</button>
            <label class="log-auto-refresh"><input type="checkbox" id="autoRefreshLog"> 自动刷新 (3秒)</label>
        </div>
        <div class="logs-box" id="logs"></div>
        <div class="pagination" id="logPagination"></div>
    </div>
</div>

<!-- 供应商模态框 -->
<div class="modal" id="providerModal">
    <div class="modal-content">
        <h2 id="modalTitle" style="margin-bottom:16px;font-size:18px;">添加供应商</h2>
        <input type="text" id="provName" placeholder="供应商名称">
        <input type="text" id="provEndpoint" placeholder="API端点 例：https://api.example.com/v1">
        <input type="password" id="provKey" placeholder="API Key">
        <select id="provType">
            <option value="openai">OpenAI 兼容</option>
            <option value="google">Google Gemini</option>
            <option value="cloudflare">Cloudflare Workers AI</option>
        </select>
        <button class="btn" onclick="detectModels()" id="detectBtn">探测可用模型</button>
        <div id="detectResult"></div>
        <div class="form-group">
            <label>模型列表:</label>
            <div id="modelTags" class="model-tags"></div>
            <div class="add-model-row">
                <input type="text" id="newModelName" placeholder="输入模型名称，例如 openai/gpt-4o-mini">
                <button type="button" class="btn btn-sm" onclick="addModelTagFromInput()">添加</button>
            </div>
            <small style="color: var(--text-3);">支持任意文本，可手动输入模型名称</small>
        </div>
        <select id="provPriority">
            <option value="1">P1 - 官方免费</option>
            <option value="2">P2 - 付费兜底</option>
        </select>
        <div style="display:flex;gap:10px;margin-top:20px;justify-content:flex-end;">
            <button class="btn" onclick="saveProvider()">保存</button>
            <button class="btn btn-outline" onclick="closeModal()">取消</button>
        </div>
        <input type="hidden" id="editHash">
    </div>
</div>

<!-- 模型选择对话框（探测结果） -->
<div class="model-select-modal" id="modelSelectModal">
    <div class="modal-content">
        <h3 style="margin-bottom:16px;">选择模型</h3>
        <div id="modelSelectList" class="model-checkbox-list"></div>
        <div class="btn-group" style="justify-content: space-between;">
            <button class="btn btn-sm" onclick="selectAllModels(true)">全选</button>
            <button class="btn btn-sm" onclick="selectAllModels(false)">清空</button>
            <button class="btn btn-sm" onclick="addSelectedModels()">添加选中模型</button>
            <button class="btn btn-outline btn-sm" onclick="closeModelSelectModal()">取消</button>
        </div>
    </div>
</div>

<!-- 采集源模态框 -->
<div class="modal" id="sourceModal">
    <div class="modal-content">
        <h2 style="margin-bottom:16px;font-size:18px;">添加采集源</h2>
        <input type="text" id="sourceName" placeholder="采集源名称">
        <input type="text" id="sourceUrl" placeholder="密钥采集接口URL">
        <input type="text" id="sourceModels" placeholder="目标模型，多个逗号分隔">
        <input type="text" id="sourceEndpoint" placeholder="API 调用端点">
        <div style="display:flex;gap:10px;margin-top:20px;justify-content:flex-end;">
            <button class="btn" onclick="saveSource()">保存</button>
            <button class="btn btn-outline" onclick="closeSourceModal()">取消</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ========== 全局变量 ==========
let currentEditHash = null;
let currentLogPage = 1;
const logsPerPage = 50;
let autoRefreshTimer = null;
let pendingModels = [];          // 存储探测到的模型列表（供模态框使用）

// ========== 工具函数 ==========
function showToast(msg, duration=4000) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', duration);
}

function escapeHtml(str) {
    if (str === undefined || str === null) return '';
    return String(str).replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

// ========== 模型标签管理 ==========
function addModelTag(modelName) {
    if (!modelName || typeof modelName !== 'string') return;
    const container = document.getElementById('modelTags');
    if (!container) return;
    const tag = document.createElement('div');
    tag.className = 'model-tag';
    tag.innerHTML = `${escapeHtml(modelName)} <span class="remove-tag" onclick="this.parentElement.remove()">✖</span>`;
    container.appendChild(tag);
}

function addModelTagFromInput() {
    const input = document.getElementById('newModelName');
    if (!input) return;
    const modelName = input.value.trim();
    if (modelName === '') return;
    addModelTag(modelName);
    input.value = '';
}

function getModelsFromTags() {
    const tags = document.querySelectorAll('#modelTags .model-tag');
    return Array.from(tags).map(tag => {
        let text = tag.innerText.replace('✖', '').trim();
        return text;
    });
}

function renderModelTagsFromArray(models) {
    const container = document.getElementById('modelTags');
    container.innerHTML = '';
    if (models && Array.isArray(models)) {
        models.forEach(model => { if (model) addModelTag(model); });
    }
}

// ========== 模型选择对话框 ==========
function closeModelSelectModal() {
    document.getElementById('modelSelectModal').style.display = 'none';
}

function selectAllModels(selectAll) {
    const checkboxes = document.querySelectorAll('#modelSelectList input[type="checkbox"]');
    checkboxes.forEach(cb => cb.checked = selectAll);
}

function addSelectedModels() {
    const checkboxes = document.querySelectorAll('#modelSelectList input[type="checkbox"]:checked');
    const selected = Array.from(checkboxes).map(cb => cb.value);
    if (selected.length === 0) {
        showToast('未选择任何模型');
        return;
    }
    selected.forEach(model => addModelTag(model));
    closeModelSelectModal();
    showToast(`已添加 ${selected.length} 个模型`);
}

// 过滤模型（根据供应商类型和端点）
function filterModelsByProvider(models, providerType, endpoint) {
    if (!models || !Array.isArray(models)) return [];
    // 根据常见的供应商特征进行过滤
    if (providerType === 'google') {
        // Google 模型通常以 gemini- 开头
        return models.filter(m => m.startsWith('gemini-'));
    } else if (providerType === 'cloudflare') {
        // Cloudflare 模型以 @cf/ 开头
        return models.filter(m => m.startsWith('@cf/'));
    } else {
        // OpenAI 兼容类型：根据 endpoint 判断
        if (endpoint.includes('nvidia') || endpoint.includes('integrate.api.nvidia.com')) {
            // 英伟达只保留 nvidia/ 开头的模型
            return models.filter(m => m.startsWith('nvidia/'));
        } else if (endpoint.includes('github') || endpoint.includes('models.github.ai')) {
            // GitHub 保留 openai/ 或 meta/ 等（通用）
            return models.filter(m => m.startsWith('openai/') || m.startsWith('meta/') || m.startsWith('anthropic/'));
        } else if (endpoint.includes('deepseek')) {
            // DeepSeek 保留 deepseek- 开头的
            return models.filter(m => m.startsWith('deepseek-'));
        } else {
            // 默认返回所有，但去除明显异常的（如空字符串）
            return models.filter(m => m && typeof m === 'string' && m.length > 0);
        }
    }
}

// ========== 探测模型 ==========
async function detectModels() {
    if (currentEditHash) {
        // 编辑模式：使用已保存的供应商信息探测
        const btn = document.getElementById('detectBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="loading"></span> 探测中';
        try {
            const res = await fetch(`/api/providers/detect/${currentEditHash}`, { method: 'POST' });
            const data = await res.json();
            if (data.success && data.models && Array.isArray(data.models)) {
                // 获取当前供应商的类型和端点（从编辑的表单中获取）
                const providerType = document.getElementById('provType').value;
                const endpoint = document.getElementById('provEndpoint').value.trim();
                const filtered = filterModelsByProvider(data.models, providerType, endpoint);
                if (filtered.length === 0) {
                    showToast('未探测到有效模型（已过滤）');
                    document.getElementById('detectResult').innerHTML = `探测到 ${data.models.length} 个模型，过滤后无有效模型`;
                } else {
                    pendingModels = filtered;
                    // 显示选择对话框
                    const listDiv = document.getElementById('modelSelectList');
                    listDiv.innerHTML = '';
                    filtered.forEach(model => {
                        const label = document.createElement('label');
                        label.innerHTML = `<input type="checkbox" value="${escapeHtml(model)}"> ${escapeHtml(model)}`;
                        listDiv.appendChild(label);
                    });
                    document.getElementById('modelSelectModal').style.display = 'flex';
                    document.getElementById('detectResult').innerHTML = `探测到 ${data.models.length} 个模型，过滤后 ${filtered.length} 个有效`;
                }
            } else {
                document.getElementById('detectResult').innerHTML = `探测失败：${data.error || '未知错误'}`;
            }
        } catch(e) {
            showToast('接口请求异常');
        }
        btn.disabled = false;
        btn.innerHTML = '探测可用模型';
        return;
    }

    // 新增模式
    const providerType = document.getElementById('provType').value;
    const endpoint = document.getElementById('provEndpoint').value.trim();
    const api_key = document.getElementById('provKey').value.trim();

    if (providerType === 'cloudflare') {
        showToast('Cloudflare Workers AI 暂不支持自动探测，请手动填写模型名');
        return;
    }
    if (!endpoint || !api_key) {
        showToast('请填写接口地址与密钥');
        return;
    }

    const btn = document.getElementById('detectBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="loading"></span> 探测中';
    try {
        const res = await fetch('/api/providers/detect', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({endpoint, api_key, provider_type: providerType})
        });
        const data = await res.json();
        if (data.success && data.models && Array.isArray(data.models)) {
            const filtered = filterModelsByProvider(data.models, providerType, endpoint);
            if (filtered.length === 0) {
                showToast('未探测到有效模型（已过滤）');
                document.getElementById('detectResult').innerHTML = `探测到 ${data.models.length} 个模型，过滤后无有效模型`;
            } else {
                pendingModels = filtered;
                const listDiv = document.getElementById('modelSelectList');
                listDiv.innerHTML = '';
                filtered.forEach(model => {
                    const label = document.createElement('label');
                    label.innerHTML = `<input type="checkbox" value="${escapeHtml(model)}"> ${escapeHtml(model)}`;
                    listDiv.appendChild(label);
                });
                document.getElementById('modelSelectModal').style.display = 'flex';
                document.getElementById('detectResult').innerHTML = `探测到 ${data.models.length} 个模型，过滤后 ${filtered.length} 个有效`;
            }
        } else {
            document.getElementById('detectResult').innerHTML = `探测失败：${data.error || '未知错误'}`;
        }
    } catch(e) {
        showToast('接口请求异常');
    }
    btn.disabled = false;
    btn.innerHTML = '探测可用模型';
}

// ========== 数据加载 ==========
async function refreshAll() {
    await Promise.all([loadHealth(), loadSources(), loadProviders(), loadLogs(currentLogPage)]);
}

async function loadHealth() {
    const res = await fetch('/health');
    const data = await res.json();
    document.getElementById('uptime').textContent = data.uptime;
    let html = '';
    html += `<div class="card"><div style="font-size:22px;font-weight:700;margin-bottom:4px;">${data.pool_stats.P0}</div><div style="font-size:13px;color:var(--text-2)">P0 中转 Key</div></div>`;
    html += `<div class="card"><div style="font-size:22px;font-weight:700;margin-bottom:4px;">${data.pool_stats.P1}</div><div style="font-size:13px;color:var(--text-2)">P1 免费 Key</div></div>`;
    html += `<div class="card"><div style="font-size:22px;font-weight:700;margin-bottom:4px;">${data.pool_stats.P2}</div><div style="font-size:13px;color:var(--text-2)">P2 付费 Key</div></div>`;
    html += `<div class="card"><div style="font-size:22px;font-weight:700;color:var(--green);margin-bottom:4px;">${data.active}</div><div style="font-size:13px;color:var(--text-2)">活跃可用 Key</div></div>`;
    if (data.active_key) html += `<div class="card"><div style="font-weight:600;margin-bottom:4px;">当前使用密钥</div><div style="font-size:13px;color:var(--text-2)">${data.active_key.preview} · ${data.active_key.model}</div></div>`;
    if (data.backup_key) html += `<div class="card"><div style="font-weight:600;margin-bottom:4px;">备用密钥</div><div style="font-size:13px;color:var(--text-2)">${data.backup_key.preview} · ${data.backup_key.model}</div></div>`;
    const crawler = data.crawler;
    if (crawler.last_update) {
        const last = new Date(crawler.last_update).toLocaleTimeString();
        const next = crawler.next_update ? new Date(crawler.next_update).toLocaleTimeString() : '--';
        html += `<div class="card"><div style="font-weight:600;margin-bottom:4px;">爬虫抓取状态</div><div style="font-size:13px;color:var(--text-2)">上次更新:${last}<br>下次更新:${next}<br>可用密钥:${crawler.key_count}</div></div>`;
    }
    const stats = data.stats;
    html += `<div class="card"><div style="font-weight:600;margin-bottom:4px;">请求统计</div><div style="font-size:13px;color:var(--text-2)">总请求:${stats.total_requests}<br>成功率:${(stats.success_rate*100).toFixed(1)}%<br>平均延迟:${stats.avg_latency}s</div></div>`;
    document.getElementById('statusCards').innerHTML = html;
}

async function loadSources() {
    const res = await fetch('/api/sources');
    const sources = await res.json();
    let html = '';
    sources.forEach((s, i) => {
        html += `<tr><td><strong>${escapeHtml(s.name || '未命名')}</strong></td><td><div class="text-ellipsis" data-full="${escapeHtml(s.url)}">${escapeHtml(s.url)}</div></td><td>${s.target_models.join(', ')}</td><td><div class="text-ellipsis" data-full="${escapeHtml(s.endpoint)}">${escapeHtml(s.endpoint)}</div></td><td><button class="btn btn-danger btn-sm" onclick="deleteSource(${i})">删除</button></td></tr>`;
    });
    document.getElementById('sourcesTable').innerHTML = html || '<tr><td colspan="5" style="text-align:center;color:var(--text-3)">暂无采集源</td></tr>';
}

async function loadProviders() {
    const res = await fetch('/api/providers');
    const data = await res.json();
    let html = '';
    data.forEach(p => {
        const statusColor = p.status === 'active' ? 'var(--green)' : (p.cooldown > 0 ? 'var(--yellow)' : 'var(--red)');
        const statusText = p.status === 'active' ? '在线' : (p.cooldown > 0 ? '冷却中' : '已失效');
        html += `<tr><td>${escapeHtml(p.name || '未命名')}</td><td>P${p.priority}</td><td>${p.avg_latency}s</td><td><span class="status-dot" style="background:${statusColor}"></span>${statusText}</td><td><button class="btn btn-sm" onclick="testProvider('${p.full_key_hash}', event)">测试</button><button class="btn btn-sm" onclick="editProvider('${p.full_key_hash}')">编辑</button></td></tr>`;
    });
    document.getElementById('providerTable').innerHTML = html || '<tr><td colspan="5" style="text-align:center;color:var(--text-3)">暂无供应商</td></tr>';
}

async function testProvider(hash, event) {
    const btn = event.target;
    const originalText = btn.innerText;
    btn.innerText = '测试中...';
    btn.disabled = true;
    try {
        const res = await fetch(`/api/providers/test/${hash}`, { method: 'POST' });
        const data = await res.json();
        if (data.success) {
            showToast(`✅ 测试成功 | 状态码 ${data.status_code} | 延迟 ${data.latency_ms}ms | 响应: ${data.response_preview || 'OK'}`);
        } else {
            showToast(`❌ 测试失败 | 状态码 ${data.status_code || '无'} | 错误: ${data.error || '未知错误'}`);
        }
    } catch (err) {
        showToast('测试请求异常: ' + err.message);
    } finally {
        btn.innerText = originalText;
        btn.disabled = false;
        await loadProviders();
        await loadHealth();
    }
}

async function loadLogs(page) {
    currentLogPage = page;
    const limit = logsPerPage;
    const res = await fetch(`/api/logs?page=${page}&limit=${limit}`);
    const data = await res.json();
    let html = '';
    data.logs.forEach(l => {
        const color = l.level === 'ERROR' ? 'var(--red)' : (l.level === 'WARNING' ? 'var(--yellow)' : 'var(--green)');
        html += `<div style="color:${color};margin-bottom:3px;">[${l.time.slice(11,19)}] ${escapeHtml(l.message)}</div>`;
    });
    document.getElementById('logs').innerHTML = html || '暂无运行日志';
    let paginationHtml = '';
    for (let i = 1; i <= data.total_pages; i++) {
        paginationHtml += `<button class="btn btn-outline btn-sm" onclick="loadLogs(${i})" ${i === page ? 'disabled' : ''}>${i}</button>`;
    }
    document.getElementById('logPagination').innerHTML = paginationHtml;
}

// ========== 供应商保存/编辑/删除 ==========
function closeModal() {
    document.getElementById('providerModal').style.display = 'none';
    currentEditHash = null;
    document.getElementById('provKey').value = '';
}

function openAddModal() {
    currentEditHash = null;
    document.getElementById('modalTitle').textContent = '添加供应商';
    document.getElementById('editHash').value = '';
    document.getElementById('provName').value = '';
    document.getElementById('provEndpoint').value = '';
    document.getElementById('provKey').value = '';
    document.getElementById('provType').value = 'openai';
    document.getElementById('provPriority').value = '1';
    document.getElementById('detectResult').innerHTML = '';
    document.getElementById('modelTags').innerHTML = '';
    document.getElementById('newModelName').value = '';
    document.getElementById('providerModal').style.display = 'flex';
}

async function saveProvider() {
    const name = document.getElementById('provName').value.trim() || '未命名供应商';
    const endpoint = document.getElementById('provEndpoint').value.trim();
    const api_key = document.getElementById('provKey').value.trim();
    const priority = parseInt(document.getElementById('provPriority').value);
    const providerType = document.getElementById('provType').value;
    const editHash = document.getElementById('editHash').value;
    const selectedModels = getModelsFromTags();

    if (!editHash) {
        if (!endpoint || !api_key) { showToast('接口地址和密钥不能为空'); return; }
        if (selectedModels.length === 0) { showToast('请至少添加一个模型'); return; }
    }

    const body = { name, priority, provider_type: providerType };
    if (endpoint) body.endpoint = endpoint;
    if (api_key) body.api_key = api_key;
    if (selectedModels.length > 0) body.selected_models = selectedModels;

    const url = editHash ? `/api/providers/${editHash}` : '/api/providers';
    const method = editHash ? 'PUT' : 'POST';
    try {
        const res = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
        if (res.ok) {
            showToast(editHash ? '供应商修改成功' : '供应商添加成功');
            closeModal();
            refreshAll();
        } else {
            const err = await res.json();
            showToast('操作失败：' + err.error);
        }
    } catch(e) { showToast('网络请求出错'); }
}

async function editProvider(hash) {
    currentEditHash = hash;
    const res = await fetch('/api/providers');
    const data = await res.json();
    const p = data.find(d => d.full_key_hash === hash);
    if (!p) return;
    document.getElementById('modalTitle').textContent = '编辑供应商';
    document.getElementById('editHash').value = hash;
    document.getElementById('provName').value = p.name || '';
    document.getElementById('provEndpoint').value = p.endpoint || '';
    document.getElementById('provKey').value = '';
    document.getElementById('provType').value = p.provider_type || 'openai';
    document.getElementById('provPriority').value = p.priority;
    document.getElementById('detectResult').innerHTML = '';
    const models = (p.selected_models && Array.isArray(p.selected_models)) ? p.selected_models : (p.verified_models || []);
    renderModelTagsFromArray(models);
    document.getElementById('providerModal').style.display = 'flex';
}

// ========== 采集源管理 ==========
function openSourceModal() {
    document.getElementById('sourceName').value = '';
    document.getElementById('sourceUrl').value = '';
    document.getElementById('sourceModels').value = 'deepseek-chat';
    document.getElementById('sourceEndpoint').value = 'https://aiapiv2.pekpik.com/v1';
    document.getElementById('sourceModal').style.display = 'flex';
}
function closeSourceModal() { document.getElementById('sourceModal').style.display = 'none'; }
async function saveSource() {
    const url = document.getElementById('sourceUrl').value.trim();
    if (!url) { showToast('接口URL不能为空'); return; }
    const body = {
        url,
        name: document.getElementById('sourceName').value.trim() || '未命名采集源',
        target_models: document.getElementById('sourceModels').value.split(',').map(s => s.trim()).filter(Boolean),
        endpoint: document.getElementById('sourceEndpoint').value.trim() || 'https://aiapiv2.pekpik.com/v1'
    };
    try {
        const res = await fetch('/api/sources', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
        if (res.ok) {
            showToast('采集源添加成功');
            closeSourceModal();
            loadSources();
        } else {
            const err = await res.json();
            showToast('添加失败：' + err.error);
        }
    } catch(e) { showToast('请求异常'); }
}
async function deleteSource(index) {
    if (!confirm('确认删除该采集源？')) return;
    await fetch(`/api/sources/${index}`, { method: 'DELETE' });
    showToast('采集源已删除');
    loadSources();
}

// ========== 日志自动刷新 ==========
function setupAutoRefresh() {
    const checkbox = document.getElementById('autoRefreshLog');
    checkbox.addEventListener('change', (e) => {
        if (e.target.checked) {
            if (autoRefreshTimer) clearInterval(autoRefreshTimer);
            autoRefreshTimer = setInterval(() => { loadLogs(currentLogPage); }, 3000);
        } else {
            if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
        }
    });
}

// ========== 页面初始化 ==========
document.getElementById('baseURL').textContent = window.location.origin;
refreshAll();
setupAutoRefresh();
</script>
